version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: univ_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: univ_project
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - univ_network

  api:
    build: .
    container_name: univ_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - PUBLISHABLE_KEY=${PUBLISHABLE_KEY}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - univ_network

volumes:
  pgdata:

networks:
  univ_network:
    driver: bridge
